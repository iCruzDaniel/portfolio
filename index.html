<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Daniel Cruz — Mechatronics & Systems Engineering professional. Software development, microcontroller programming, and AI applied to industry.">
        <title>Daniel Cruz Portfolio</title>
        <link rel="shortcut icon" href="img/circuito-green.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preload" as="image" href="img/Perfil.webp" fetchpriority="high">
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
            rel="stylesheet" media="print" onload="this.media='all'">
        <noscript>
            <link
                href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
                rel="stylesheet">
        </noscript>
    </head>
    <body class="main-content">
        <script>
            (function() {
                var light = false;
                try {
                    var saved = localStorage.getItem('theme');
                    if (saved === 'light' || saved === 'dark') {
                        light = saved === 'light';
                    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                        light = true;
                    }
                } catch (e) {}
                if (light) document.body.classList.add('light-mode');
            })();
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
